{% extends "base.html" %}
{% block content %}
<div class="card card-dark mb-4 shadow-sm">
    <div class="card-body">
        <h2 class="card-title h4 mb-4 text-center">Add Saving</h2>
        <form method="POST" id="savingForm">
            <div class="mb-3">
                <label class="form-label">Amount (₹)</label>
                <input type="number" name="amount" id="amount" step="0.01" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Saving Mode</label>
                <select name="saving_mode" id="saving_mode" class="form-select" required>
                    <option value="Cash">Cash</option>
                    <option value="Bank">Bank</option>
                    <option value="Investment">Investment</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Date</label>
                <input type="date" name="date" id="date" value="{{ current_date }}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Note</label>
                <input type="text" name="note" id="note" class="form-control">
            </div>
            <button type="submit" class="btn btn-success w-100 py-3 mt-3" id="submitBtn">
                <i class="bi bi-save me-2"></i> Save Saving
            </button>
        </form>
    </div>
</div>

<script>
// Offline form submission
document.getElementById('savingForm').addEventListener('submit', async function(e) {
    // Only intercept if offline
    if (!navigator.onLine && window.OfflineDB) {
        e.preventDefault();
        
        const formData = {
            amount: document.getElementById('amount').value,
            saving_mode: document.getElementById('saving_mode').value,
            date: document.getElementById('date').value,
            time: window.OfflineDB.getISTDate().toTimeString().slice(0, 5),
            note: document.getElementById('note').value
        };
        
        try {
            await window.OfflineDB.addToSyncQueue('saving', 'add', formData);
            
            // Show success message
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<i class="bi bi-check-circle me-2"></i> Saved Offline!';
            btn.classList.remove('btn-success');
            btn.classList.add('btn-warning');
            
            // Redirect after short delay
            setTimeout(() => {
                window.location.href = '/saving_report';
            }, 1500);
        } catch (error) {
            console.error('Finchest: Error saving offline saving', error);
            alert('Error saving. Please try again.');
        }
    }
    // If online, let the form submit normally
});
</script>
{% endblock %}
