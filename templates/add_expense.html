{% extends "base.html" %}
{% block content %}
<div class="card card-dark mb-4 shadow-sm">
    <div class="card-body">
        <h2 class="card-title h4 mb-4 text-center">Add Expense</h2>
        <form method="POST" id="expenseForm">
            <div class="mb-3">
                <label class="form-label">Amount (₹)</label>
                <input type="number" name="amount" id="amount" step="0.01" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Category</label>
                <select name="category" id="category" class="form-select" required>
                    <option value="Travel">Travel</option>
                    <option value="Food">Food</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Mazze">Mazze</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Payment Mode</label>
                <select name="payment_mode" id="payment_mode" class="form-select" required>
                    <option value="UPI">UPI</option>
                    <option value="Cash">Cash</option>
                    <option value="Card">Card</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Date</label>
                <input type="date" name="date" id="date" value="{{ current_date }}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Time (Optional)</label>
                <input type="time" name="time" id="time" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Note</label>
                <input type="text" name="note" id="note" class="form-control">
            </div>
            <button type="submit" class="btn btn-success w-100 py-3 mt-3" id="submitBtn">
                <i class="bi bi-save me-2"></i> Save Expense
            </button>
        </form>
    </div>
</div>

<script>
// Offline form submission
document.getElementById('expenseForm').addEventListener('submit', async function(e) {
    // Only intercept if offline
    if (!navigator.onLine && window.OfflineDB) {
        e.preventDefault();
        
        const formData = {
            amount: document.getElementById('amount').value,
            category: document.getElementById('category').value,
            payment_mode: document.getElementById('payment_mode').value,
            date: document.getElementById('date').value,
            time: document.getElementById('time').value || window.OfflineDB.getISTDate().toTimeString().slice(0, 5),
            note: document.getElementById('note').value
        };
        
        try {
            await window.OfflineDB.addToSyncQueue('expense', 'add', formData);
            
            // Show success message
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<i class="bi bi-check-circle me-2"></i> Saved Offline!';
            btn.classList.remove('btn-success');
            btn.classList.add('btn-warning');
            
            // Redirect after short delay
            setTimeout(() => {
                window.location.href = '/expense_report';
            }, 1500);
        } catch (error) {
            console.error('Finchest: Error saving offline expense', error);
            alert('Error saving expense. Please try again.');
        }
    }
    // If online, let the form submit normally
});
</script>
{% endblock %}
